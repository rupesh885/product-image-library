<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Lakadong Turmeric Powder (High Curcumin)</title>
  <desc id="desc">Premium product illustration of golden turmeric powder in a dark wooden bowl, fresh turmeric roots, green leaves and a small wooden scoop on a pure white background.</desc>
  <defs>
    <linearGradient id="bowl" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#82512a"/>
      <stop offset=".28" stop-color="#5e351c"/>
      <stop offset=".62" stop-color="#3b2114"/>
      <stop offset="1" stop-color="#6c3d20"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bd8950"/>
      <stop offset=".32" stop-color="#70401f"/>
      <stop offset="1" stop-color="#382014"/>
    </linearGradient>
    <linearGradient id="powder" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ffd34e"/>
      <stop offset=".43" stop-color="#f2a900"/>
      <stop offset="1" stop-color="#d87900"/>
    </linearGradient>
    <linearGradient id="root" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5bb72"/>
      <stop offset=".55" stop-color="#c78b42"/>
      <stop offset="1" stop-color="#99602d"/>
    </linearGradient>
    <linearGradient id="cut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffdc4b"/>
      <stop offset="1" stop-color="#ef8a00"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#77ad32"/>
      <stop offset=".55" stop-color="#367b25"/>
      <stop offset="1" stop-color="#185323"/>
    </linearGradient>
    <linearGradient id="scoop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8723c"/>
      <stop offset="1" stop-color="#5b341a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="powderClip">
      <path d="M276 526 Q410 440 493 267 Q535 172 585 158 Q633 174 687 288 Q761 411 870 526 Z"/>
    </clipPath>
  </defs>
  <rect width="1200" height="1200" fill="#fff"/>
  <ellipse cx="600" cy="944" rx="430" ry="48" fill="#d9d9d9" opacity=".35" filter="url(#shadow)"/>
