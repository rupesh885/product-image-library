    <circle cx="301" cy="927" r="3"/><circle cx="293" cy="945" r="4"/><circle cx="338" cy="960" r="3"/><circle cx="366" cy="972" r="3"/>
    <circle cx="751" cy="960" r="3"/><circle cx="773" cy="974" r="4"/><circle cx="795" cy="963" r="3"/><circle cx="818" cy="982" r="3"/>
